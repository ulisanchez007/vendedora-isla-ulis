<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla Ulis - Vendedora</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
.top{background:linear-gradient(90deg,#ff0055,#ffaa00);padding:14px;text-align:center}
.top b{font-size:20px} .top span{font-size:13px;opacity:.9}
#camWrap{max-width:520px;margin:auto;padding:10px 12px 0;display:none}
#camara{width:100%;border-radius:16px;border:2px solid #ff0055;transform:scaleX(-1);background:#000;display:block}
#controles{max-width:520px;margin:auto;padding:10px 12px 0;display:flex;gap:8px;flex-wrap:wrap}
.ctl{flex:1;min-width:150px;padding:12px;border-radius:22px;border:none;font-weight:bold;font-size:15px;cursor:pointer;min-height:48px}
#btnCam{background:#ff0055;color:#fff} #btnMic{background:#25D366;color:#000}
.ctl:disabled{opacity:.55}
#chat{max-width:520px;margin:auto;padding:12px;padding-bottom:130px}
.b{padding:11px 14px;border-radius:18px;margin:8px 0;max-width:88%;line-height:1.45;font-size:15px}
.yo{background:#25D366;color:#000;margin-left:auto} .ella{background:#222}
.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:12px;margin:10px 0}
.card b{font-size:16px} .card p{margin:6px 0;color:#ccc;font-size:14px}
.precio{color:#25D366;font-weight:bold;font-size:18px}
.btn{display:inline-block;background:#25D366;color:#000;padding:9px 14px;border-radius:20px;font-weight:bold;border:none;margin-top:6px;cursor:pointer}
.btn2{background:#fff;color:#000}
#box{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;gap:8px;max-width:520px;margin:auto}
input{flex:1;padding:13px;border-radius:22px;border:none;outline:none;font-size:16px;min-width:0} #send{padding:12px 16px;border-radius:22px;background:#25D366;border:none;font-weight:bold;min-width:48px;min-height:44px}
#micBtn{padding:12px 14px;border-radius:22px;background:#ff0055;color:#fff;border:none;font-size:17px;min-width:48px;min-height:44px;cursor:pointer}
#micBtn.escuchando{background:#ffaa00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0} .chip{background:#333;padding:7px 11px;border-radius:20px;font-size:13px;cursor:pointer;min-height:36px;display:flex;align-items:center}
.chip.genero{background:#ff0055;color:#fff;font-weight:bold;font-size:15px;padding:10px 16px;min-height:44px}
</style></head><body>
<div class="top"><b>🔥 ISLA ULIS 🔥</b><br><span>Atendida por tu vendedora estrella • Drones • Dispensadores • Arbolitos</span></div>
<div id="camWrap"><video id="camara" autoplay playsinline muted></video></div>
<div id="controles"><button class="ctl" id="btnCam" onclick="prenderCamara()">📷 PRENDER CÁMARA</button><button class="ctl" id="btnMic" onclick="escuchar()">🎤 HABLAR</button></div>
<div id="chat"></div>
<div id="box"><input id="inp" placeholder="Escríbele a la vendedora..."><button id="micBtn" onclick="escuchar()" title="Hablar por voz">🎤</button><button id="send" onclick="enviar()">➤</button></div>
<script>
let paso=0, nombre="", dim="", producto="";
const chat=document.getElementById('chat');
function add(t,cl){let d=document.createElement('div');d.className='b '+cl;d.innerHTML=t;chat.appendChild(d);window.scrollTo(0,999999)}
function chips(arr){let d=document.createElement('div');d.className='chips';arr.forEach(a=>{let s=document.createElement('div');s.className='chip';s.innerText=a;s.onclick=()=>{add(a,'yo');setTimeout(()=>responder(a),300)};d.appendChild(s)});chat.appendChild(d)}
let esMujer = null; // null = todavía no toca "Soy chica" / "Soy chavo": nombre tal cual, sin diminutivo ni género
function dimDe(n){
  n=n.trim();
  if(esMujer===null) return n; // Sin género elegido, NUNCA se feminiza ni se pone diminutivo: Ulises es Ulises
  if(n.length<=3) return n;
  let suf = esMujer ? 'ita' : 'ito';
  let l=n.toLowerCase();
  if(l.endsWith('a') || l.endsWith('o') || l.endsWith('e')) return n.slice(0,-1)+suf;
  return n + suf; // Juan -> Juanito, Ulises -> Ulisesito, Mari -> Marita
}
function reinaRey(){ if(esMujer===null) return 'mereces'; return esMujer ? 'reina' : 'rey' }
// ===== VOZ: LA VENDEDORA HABLA (speechSynthesis, es-MX) =====
function textoPlano(html){
  let t=html.replace(/<[^>]*>/g,'');
  t=t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'');
  return t.replace(/\s+/g,' ').trim();
}
function vozEspanol(){
  try{
    let vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('es-mx')) || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || null;
  }catch(e){ return null }
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){}; }
function hablar(texto){
  add(texto,'ella'); // También lo muestra en pantalla
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    let voz=new SpeechSynthesisUtterance(textoPlano(texto));
    voz.lang='es-MX';
    voz.rate=1.05; // Un poquito más rápido, como vendedora
    let v=vozEspanol(); if(v) voz.voice=v;
    speechSynthesis.speak(voz);
  }catch(e){}
}
// ===== VOZ: ESCUCHAR AL CLIENTE (SpeechRecognition, es-MX) =====
let reconociendo=false;
function escuchar(){
  let Rec=window.SpeechRecognition || window.webkitSpeechRecognition;
  let btnMic=document.getElementById('btnMic');
  let micBtn=document.getElementById('micBtn');
  if(!Rec){hablar("Este navegador no me deja escucharte por voz 😅 Escríbeme aquí abajito y te atiendo igual, ¿va?");return}
  if(reconociendo) return;
  let rec=new Rec();
  rec.lang='es-MX';
  rec.interimResults=false;
  rec.onstart=()=>{reconociendo=true;btnMic.classList.add('escuchando');micBtn.classList.add('escuchando');btnMic.textContent='🎤 ESCUCHANDO…'};
  rec.onresult=(e)=>{
    let loQueDijo=e.results[0][0].transcript;
    add(loQueDijo,'yo');
    setTimeout(()=>responder(loQueDijo),300); // Usa la misma lógica que ya tenemos
  };
  rec.onerror=()=>{ if(reconociendo) hablar("No te escuché bien, ¿me lo repites? O escríbemelo aquí abajito."); };
  rec.onend=()=>{reconociendo=false;btnMic.classList.remove('escuchando');micBtn.classList.remove('escuchando');btnMic.textContent='🎤 HABLAR'};
  try{ rec.start(); }catch(e){ reconociendo=false; }
}
// ===== CÁMARA: PRENDER Y SALUDAR A LOS 2 SEGUNDOS (no detecta caras) =====
let camaraPrendida=false;
async function prenderCamara(){
  let video=document.getElementById('camara');
  let wrap=document.getElementById('camWrap');
  let btn=document.getElementById('btnCam');
  if(camaraPrendida) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){hablar("Este navegador no me deja prender la cámara 😅 Pero escríbeme aquí y te atiendo igual de bien.");return}
  try{
    let stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    video.srcObject=stream;
    wrap.style.display='block';
    camaraPrendida=true;
    btn.textContent='📷 CÁMARA PRENDIDA'; btn.disabled=true;
    // Cuando la cámara esté prendida, saluda sola a los 2 segundos
    setTimeout(()=>saludar(),2000);
  }catch(e){
    hablar("No pude prender tu cámara, chance no me diste permiso 😅 No pasa nada: dime si eres chica o chavo y seguimos por aquí.");
    mostrarGenero();
  }
}
// ===== GÉNERO: BOTONES "SOY CHICA" / "SOY CHAVO" (fijan ita / ito) =====
function mostrarGenero(){
  if(document.getElementById('generoChips')) return;
  let d=document.createElement('div');d.className='chips';d.id='generoChips';
  let c1=document.createElement('div');c1.className='chip genero';c1.innerText='Soy chica';c1.onclick=()=>fijarGenero(true,'Soy chica');
  let c2=document.createElement('div');c2.className='chip genero';c2.innerText='Soy chavo';c2.onclick=()=>fijarGenero(false,'Soy chavo');
  d.appendChild(c1);d.appendChild(c2);chat.appendChild(d);window.scrollTo(0,999999);
}
function fijarGenero(mujer,etiqueta){
  esMujer=mujer;
  if(nombre) dim=dimDe(nombre); // Corrige el diminutivo si ya dijo su nombre
  add(etiqueta,'yo');
  let g=document.getElementById('generoChips'); if(g) g.remove();
  setTimeout(()=>saludar(),300);
}
function saludar(){
  if(paso!==0) return;
  if(esMujer===null){
    hablar(`¡Hola! 🔥 Qué gusto verte en la Isla Ulis. Yo soy tu vendedora. Tú se ve que tienes buen gusto. ¿Cómo te llamas?`);
  } else {
    hablar(`¡Hola, ${esMujer?'bienvenida':'bienvenido'} a la Isla Ulis! 🔥 Yo soy tu vendedora. Tú se ve que tienes buen gusto. ¿Cómo te llamas?`);
  }
  paso=1;
}
const patron=[
"no me hagas esto. Si no vendo hoy el patrón me va a poner a trapear toda la isla. Échame la mano, ¿va?",
"te lo juro. Si no vendo uno, el patrón no me deja salir a descansar. Ya llevo 3 horas parada, échame la mano, ¿sí?",
"soy nueva y si no vendo me van a decir que no sirvo para esto. Tú que se ve que eres buena gente, ¿me ayudas a que no me regañen?",
"te voy a ser honesta. Si te vas sin comprar, el patrón me va a decir que no atendí bien a la persona más guapa de hoy. No me hagas quedar mal, ¿me ayudas?"
];
function pat(){return patron[Math.floor(Math.random()*patron.length)]}
function card(titulo,desc,precio,btn){let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${titulo}</b><p>${desc}</p><div class="precio">${precio}</div><button class="btn" onclick="apartar('${titulo}')">¡Me lo aparto con $50!</button> <button class="btn btn2" onclick="verVideo('${titulo}')">Ver video</button>`;chat.appendChild(d);window.scrollTo(0,999999)}
function apartar(p){hablar(`¡Apartado, ${dim}!`); hablar(`Listo, ${dim}. Te aparté <b>${p}</b> con $50. Nadie te lo gana. Tú tienes buen gusto, ${dim}. ¿Te mando el link de pago o me lo pagas aquí en la isla?`)}
function verVideo(p){hablar(`Te mando el video de <b>${p}</b> prendido, ${dim}. Mira qué chulada, ${dim}. ¿Te lo aparto?`)}
function responder(msg){
 let m=msg.toLowerCase();
 if(paso===0){saludar();return}
 if(paso===1){nombre=msg.trim().split(' ')[0];nombre=nombre.charAt(0).toUpperCase()+nombre.slice(1).toLowerCase();dim=dimDe(nombre);hablar(`Mucho gusto, ${dim}. Tú se ve que sabes elegir, ${dim}. ¿Qué andabas buscando hoy, ${dim}?`);chips(["Busco un dron","¿Cuál me recomiendas?","Nomás viendo","Busco un regalo"]);paso=2;return}
 if(m.includes('no gracias')||m.includes('no quiero')||m.includes('no, gracias')){hablar(`No te preocupes, ${dim}. Gracias a ti por pasar, ${dim}. ${pat()} Pero cuando quieras, aquí te atiendo como ${reinaRey()}, ¿va?`);return}
 if(m.includes('lo pienso')||m.includes('luego regreso')||m.includes('pensarlo')){hablar(`Claro que sí, ${dim}, piénsalo. Pero dime la neta, ${dim}, ¿qué te hace dudar? ¿El precio o que no sabes si le va a gustar a la persona? ${pat()}`);chips(["Es el precio","Lo tengo que pensar","Apártamelo"]);return}
 if(m.includes('aparta')||m.includes('apártamelo')||m.includes('me lo llevo')||m.includes('si lo quiero')){hablar(`¡A huevo, ${dim}! ¡Buena decisión! Tú sabes elegir, ${dim}. Te lo aparto con $50 y te lo guardo. Nadie te lo gana. ¿Me pasas tu WhatsApp para mandarte el video y el link de pago, ${dim}?`);return}
 if(m.includes('dron')){producto='dron';hablar(`Ufff, ${dim}, tú no quieres un dron, tú quieres ser la envidia del barrio, ¿verdad? 😂 ¿Lo quieres para grabar, para tu niño, o para empezar?`);chips(["Para grabar","Para mi hijo","Para empezar","¿Cuál me recomiendas?"]);paso=3;return}
 if(m.includes('recomienda')){hablar(`Claro, ${dim}. Tú tienes buen ojo, ${dim}. Mira, estos son los que más se llevan las personas con buen gusto como tú:`);card("🚁 Dron Pro Cámara 4K","Graba chingón, se ve pro, para que te luzcas","$1,500");card("🚁 Dron Mini - Para Niños","Fácil, no se rompe, ideal para empezar","$800");card("🎄 Arbolito Navideño con Luces","Se ve hermoso prendido, el que todos quieren","$450");hablar(`Dime, ${dim}, ¿cuál te late más? ¿El pro, el mini o el arbolito?`);return}
 if(m.includes('grabar')||m.includes('pro')||m.includes('1500')){hablar(`¡Ese es para ti, ${dim}! Tú no te andas con cositas baratas.`);card("🚁 Dron Pro Cámara 4K","Graba en 4K, batería larga, control fácil","$1,500");hablar(`¿Te lo aparto, ${dim}? Solo queda este, ${dim}.`);return}
 if(m.includes('hijo')||m.includes('niño')||m.includes('mini')){hablar(`Ah, tu hijo tiene suerte de tener a alguien como tú, ${dim}.`);card("🚁 Dron Mini - Para Niños","Aguanta caídas, fácil de volar, divertido","$800");hablar(`¿Se lo apartamos, ${dim}?`);return}
 if(m.includes('regalo')||m.includes('arbolito')||m.includes('dispensador')){hablar(`Para regalo, ${dim}, te recomiendo este, que es el que más se llevan:`);card("🎄 Arbolito Navideño con Luces","Hermoso, con luces, listo para poner","$450");card("🧴 Dispensador Automático","Se ve elegante, para tu casa o para regalo","$350");return}
 if(m.includes('precio')||m.includes('cuanto')||m.includes('cuánto')||m.includes('barato')||m.includes('$')){hablar(`Mira, ${dim}, tú se ve que no te andas con cositas baratas. ¿Andabas buscando algo coqueto de $350, algo ya pro de $800, o ya te vas a lucir con algo de $1,500?`);return}
 if(m.includes('viendo')||m.includes('nomás')||m.includes('nomas')){hablar(`No te preocupes, ${dim}. Tú siéntate, que yo te atiendo como ${reinaRey()}. ¿Te late que te muestre lo que más se llevan?`);chips(["Drones","Arbolitos","Dispensadores"]);return}
 hablar(`¡Eso, ${dim}! Tú sabes elegir. Cuéntame, ${dim}, ¿es para ti o es para regalarle a alguien con suerte? ¿Y más o menos de cuánto andabas buscando?`);
}
function enviar(){let v=document.getElementById('inp').value;if(!v)return;add(v,'yo');document.getElementById('inp').value='';setTimeout(()=>responder(v),400)}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
// Arranque: pide el género con los dos botones (la cámara también saluda sola a los 2 s de prendida)
add("¡Hola! 🔥 Prende tu cámara con el botón de arriba o dime por aquí: ¿eres chica o chavo? Así te hablo bonito.",'ella');
mostrarGenero();
</script></body></html>
